<title id="title">NEXO | Arquitetura DevOps</title>
<desc id="desc">Arquitetura demonstrada: acesso restrito ao IP público Azure por HTTP 8080 e SSH 22, NSG, interface de rede, VM Ubuntu com Docker e API NEXO. O Oracle FIAP permanece externo, acessado por JDBC na porta 1521. A leitura de cenários foi demonstrada, e os recursos Azure foram excluídos ao término.</desc>
